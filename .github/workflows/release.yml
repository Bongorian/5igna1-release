name: Prepare GitHub Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Validate tag and source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tools/release.py check --tag "$RELEASE_TAG"
          python3 tools/check-locales.py
          python3 tools/check-repository.py
          ./gradlew --no-daemon lint lintPlayDebug test assemblePlayDebug verifyFossDependencies dependencyInventory
          python3 tools/audit-dependencies.py --check
      - name: Build and package signed FOSS APK
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          SIGNAL_FDROID_KEYSTORE: ${{ runner.temp }}/5igna1-release.p12
          SIGNAL_FDROID_STORE_PASSWORD: ${{ secrets.FDROID_STORE_PASSWORD }}
          SIGNAL_FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          SIGNAL_FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
          FDROID_CERTIFICATE_SHA256: ${{ vars.FDROID_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail
          trap 'rm -f "$SIGNAL_FDROID_KEYSTORE"' EXIT
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          required = ('FDROID_KEYSTORE_BASE64', 'SIGNAL_FDROID_STORE_PASSWORD', 'SIGNAL_FDROID_KEY_ALIAS', 'SIGNAL_FDROID_KEY_PASSWORD', 'FDROID_CERTIFICATE_SHA256')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Configure release secrets/variables first: ' + ', '.join(missing))
          path = Path(os.environ['SIGNAL_FDROID_KEYSTORE'])
          with os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'wb') as output:
              output.write(base64.b64decode(os.environ['FDROID_KEYSTORE_BASE64'], validate=True))
          PY
          ./gradlew --no-daemon assembleFdroidRelease -PsignFdroidRelease=true
          python3 tools/release.py package --certificate-sha256 "$FDROID_CERTIFICATE_SHA256"
      - name: Attach APK and checksum to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tools/github-release.py
