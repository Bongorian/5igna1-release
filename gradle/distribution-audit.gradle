import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

// Resolve the actual selected versions, including platforms and compile/test-only dependencies.
tasks.register('dependencyInventory') {
    group = 'verification'
    description = 'Write the resolved app/test/build-tool dependency inventory for license review.'
    def destination = layout.buildDirectory.file('reports/distribution/dependencies.json')
    outputs.file(destination)
    outputs.upToDateWhen { false }
    doLast {
        def scopes = [:]
        ['fdroidReleaseRuntimeClasspath', 'fdroidReleaseCompileClasspath',
         'playReleaseRuntimeClasspath', 'playReleaseCompileClasspath',
         'fdroidDebugUnitTestRuntimeClasspath', 'playDebugUnitTestRuntimeClasspath'].each { name ->
            scopes[name] = configurations.getByName(name)
        }
        scopes['buildTools'] = rootProject.buildscript.configurations.classpath
        def result = scopes.collectEntries { name, configuration ->
            def modules = configuration.incoming.resolutionResult.allComponents.findAll {
                it.id instanceof ModuleComponentIdentifier
            }.collect { it.id.displayName }.sort()
            def artifacts = configuration.resolvedConfiguration.resolvedArtifacts.findAll {
                it.id.componentIdentifier instanceof ModuleComponentIdentifier
            }.collect { artifact ->
                [module: artifact.moduleVersion.id.toString(), file: artifact.file.name,
                 sha256: java.security.MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()]
            }.sort { a, b -> (a.module + a.file) <=> (b.module + b.file) }
            [(name): [modules: modules, artifacts: artifacts]]
        }
        def file = destination.get().asFile
        file.parentFile.mkdirs()
        file.text = JsonOutput.prettyPrint(JsonOutput.toJson(result)) + '\n'
        logger.lifecycle('Dependency inventory: {}', file)
    }
}

tasks.register('verifyFossDependencies') {
    group = 'verification'
    description = 'Reject proprietary service SDKs in the F-Droid dependency graph.'
    doLast {
        def forbidden = ['com.google.android.gms', 'com.google.firebase', 'com.google.android.play',
                         'com.android.billingclient', 'com.google.ads', 'com.facebook.android']
        def found = configurations.fdroidReleaseRuntimeClasspath.incoming.resolutionResult.allComponents.findAll {
            it.id instanceof ModuleComponentIdentifier && forbidden.any { prefix ->
                it.id.group == prefix || it.id.group.startsWith(prefix + '.')
            }
        }.collect { it.id.displayName }
        if (found) throw new GradleException('Forbidden F-Droid dependencies: ' + found.join(', '))
    }
}

tasks.named('check').configure { dependsOn('verifyFossDependencies') }
